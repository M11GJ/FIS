services:
  graduation-checker:
    build:
      context: .
      dockerfile: Dockerfile.fis
      args:
        VITE_DCC_CLIENT_ID: ${VITE_DCC_CLIENT_ID:-dcc_0yneIL16eyD4Z-VzkEO69kA6}
        VITE_DCC_REDIRECT_URI: ${VITE_DCC_REDIRECT_URI:-https://fis--gunn0511.shu-dcc.net/shu-binran/}
        VITE_DCC_SCOPES: ${VITE_DCC_SCOPES:-openid profile}
    depends_on:
      - admin-api

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile.fis
    volumes:
      - ./data:/data
    environment:
      DCC_OIDC_CLIENT_ID: ${VITE_DCC_CLIENT_ID:-dcc_0yneIL16eyD4Z-VzkEO69kA6}
      FIS_DATA_PATH: /data/course-profiles.json
      FIS_ALLOWED_HOSTS: ${FIS_ALLOWED_HOSTS:-}
