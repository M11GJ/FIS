server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;

    # MCP Streamable HTTP endpoint. Keep this before the SPA location.
    location /shu-binran/mcp {
        proxy_pass http://admin-api:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /shu-binran/api/ {
        proxy_pass http://admin-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /shu-binran/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /shu-binran/index.html;
    }

    location /shu-binran/admin/history.txt {
        alias /usr/share/nginx/html/admin/update_history.log;
    }

    location = / {
        return 301 /shu-binran/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
